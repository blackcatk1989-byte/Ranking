<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>排點介面</title>

  <!-- 字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
  :root{
    --bg: #131820;
    --bg-2: #1a2029;
    --bg-3: #232b36;
    --line: #2a3340;
    --text: #e8ecf1;
    --muted: #8892a0;
    --dim: #5b6472;
    --court: #0f5a36;
    --court-dark: #0a4428;
    --court-line: #f3f6fa;
    --active: #8ff3b5;
    --me: #eab308;
    --accent: #8ff3b5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans TC',-apple-system,sans-serif;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit}
  #root{height:100vh;width:100vw}

  /* ── 拖曳元素 ──────────────────────────────────────────────────
     注意：這裡刻意「不」設 touch-action: none。
     設了雖然拖曳會動，但手指按在球員卡片上就無法捲動頁面。
     改用 manipulation：捲動保持正常，長按 250ms 才進入拖曳模式，
     拖曳期間再由 JS 動態攔截 touchmove 阻止捲動。 */
  [data-drop]{
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 拖曳進行中：整頁鎖住捲動，避免畫面亂跑 */
  body.dnd-active{
    overflow: hidden !important;
    touch-action: none;
  }

  /* ── 拖曳時跟隨手指的浮動卡片（取代 HTML5 原生拖曳影像） ── */
  .dnd-ghost{
    position: fixed;
    left: 0; top: 0;
    transform: translate(-50%, -50%) scale(1.06);
    z-index: 99999;
    pointer-events: none;
    background: var(--accent);
    color: #0a0e14;
    font-family: 'Noto Sans TC','Inter',sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    padding: 12px 18px;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    opacity: 0.94;
    white-space: nowrap;
  }

  /* 觸控裝置（手機 + 平板，任何方向）或視窗寬度 ≤1180px：改用可捲動版面。
     注意：這裡刻意「不」再限制 orientation:portrait。
     舊條件只在直向開啟捲動，導致平板「橫向」時 body 維持 overflow:hidden，
     整頁被鎖死無法捲動 / 滑動。改成用 pointer:coarse 偵測觸控裝置後，
     平板橫向、大尺寸平板、橫向手機都能正常捲動。
     須與 main.js 的 isPortrait（compact 版面）matchMedia 判斷保持一致。 */
  @media (max-width: 1180px), (hover: none) and (pointer: coarse) {
    html, body { overflow: auto; -webkit-overflow-scrolling: touch; }
    #root { height: auto; min-height: 100dvh; }
  }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 版本全部鎖定：Babel 必須留在 7.x，8.x 預設改用 automatic JSX runtime 會讓整頁全白 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>

  <!-- Firebase Authentication（管理者登入用） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════════════
    // Firebase 設定
    // 專案：badmintion-ranking（asia-southeast1）
    // 這串金鑰公開在前端是 Firebase 的正常設計，不是安全漏洞。
    // 真正的防護來自 Realtime Database 的安全規則（見 README）。
    // ════════════════════════════════════════════════════════════════════
    firebase.initializeApp({
      apiKey: "AIzaSyBeoYWIBzBR6UVY8tTBrhlEi1xYC2ww38M",
      authDomain: "badmintion-ranking.firebaseapp.com",
      databaseURL: "https://badmintion-ranking-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "badmintion-ranking",
      storageBucket: "badmintion-ranking.firebasestorage.app",
      messagingSenderId: "76782338503",
      appId: "1:76782338503:web:457b500cf579dd9914d9e2"
    });

    // 登入狀態保留在瀏覽器，關掉分頁再打開不用重新登入
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  </script>

  <!-- 全域設定 -->
  <script>
    const TWEAKS = /*EDITMODE-BEGIN*/{
      "theme": "minimal",
      "accent": "#8ff3b5",
      "myName": ""
    }/*EDITMODE-END*/;
    window.__TWEAKS__ = TWEAKS;
  </script>

  <!-- 模組載入順序 -->
  <script type="text/babel" data-presets="react" src="main.js"></script>
</body>
</html>
