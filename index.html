<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>排點介面</title>

  <!-- 字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
  :root{
    --bg: #131820;
    --bg-2: #1a2029;
    --bg-3: #232b36;
    --line: #2a3340;
    --text: #e8ecf1;
    --muted: #8892a0;
    --dim: #5b6472;
    --court: #0f5a36;
    --court-dark: #0a4428;
    --court-line: #f3f6fa;
    --active: #8ff3b5;
    --me: #eab308;
    --accent: #8ff3b5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans TC',-apple-system,sans-serif;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit}
  #root{height:100vh;width:100vw}

  /* ── 拖曳所需：關閉瀏覽器預設的觸控行為，否則手指移動會被判定成捲動 ── */
  [data-drop]{
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── 拖曳時跟隨手指的浮動卡片（取代 HTML5 原生拖曳影像） ── */
  .dnd-ghost{
    position: fixed;
    left: 0; top: 0;
    transform: translate(-50%, -50%) scale(1.06);
    z-index: 99999;
    pointer-events: none;
    background: var(--accent);
    color: #0a0e14;
    font-family: 'Noto Sans TC','Inter',sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    padding: 12px 18px;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    opacity: 0.94;
    white-space: nowrap;
  }

  /* 手機直向 */
  @media (max-width: 820px) and (orientation: portrait) {
    html, body { overflow: auto; }
    #root { height: 100dvh; }
  }
  /* 平板直向（舊版遺漏，導致平板版面落在斷點外） */
  @media (min-width: 821px) and (max-width: 1180px) and (orientation: portrait) {
    html, body { overflow: auto; }
    #root { height: 100dvh; }
  }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 版本全部鎖定：Babel 必須留在 7.x，8.x 預設改用 automatic JSX runtime 會讓整頁全白 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>

  <!-- Firebase Authentication（管理者登入用） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════════════
    // Firebase 設定
    // 專案：badmintion-ranking（asia-southeast1）
    // 這串金鑰公開在前端是 Firebase 的正常設計，不是安全漏洞。
    // 真正的防護來自 Realtime Database 的安全規則（見 README）。
    // ════════════════════════════════════════════════════════════════════
    firebase.initializeApp({
      apiKey: "AIzaSyBeoYWIBzBR6UVY8tTBrhlEi1xYC2ww38M",
      authDomain: "badmintion-ranking.firebaseapp.com",
      databaseURL: "https://badmintion-ranking-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "badmintion-ranking",
      storageBucket: "badmintion-ranking.firebasestorage.app",
      messagingSenderId: "76782338503",
      appId: "1:76782338503:web:457b500cf579dd9914d9e2"
    });

    // 登入狀態保留在瀏覽器，關掉分頁再打開不用重新登入
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  </script>

  <!-- 全域設定 -->
  <script>
    const TWEAKS = /*EDITMODE-BEGIN*/{
      "theme": "minimal",
      "accent": "#8ff3b5",
      "myName": ""
    }/*EDITMODE-END*/;
    window.__TWEAKS__ = TWEAKS;
  </script>

  <!-- 模組載入順序 -->
  <script type="text/babel" data-presets="react" src="main.js"></script>
</body>
</html>
